name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: bash scripts/release/validate-tag.sh
      - name: Install build dependencies
        run: bash scripts/release/install-dependencies.sh
      - name: Install Rust
        run: bash scripts/release/install-rust.sh
      - name: Check formatting
        run: bash scripts/release/check-format.sh
      - name: Lint
        run: bash scripts/release/lint.sh
      - name: Test
        run: bash scripts/release/test.sh
      - name: Build
        run: bash scripts/release/build.sh
      - name: Package
        run: bash scripts/release/package.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/publish.sh
      - name: Update changelog for next cycle
        run: bash scripts/release/update-changelog.sh
