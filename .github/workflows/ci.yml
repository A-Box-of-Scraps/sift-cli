name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install Dylint
        run: cargo install cargo-dylint dylint-link --version 6.0.4 --locked
      - name: Check explicit local types
        run: cargo dylint --all -- --locked --all-targets
      - name: Test custom lint
        working-directory: lints/explicit-local-types
        run: |
          cargo fmt --all -- --check
          cargo test --locked
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release
